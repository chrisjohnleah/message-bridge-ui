name: Message Bridge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: go test ./...
        working-directory: third_party/whatsapp-mcp
