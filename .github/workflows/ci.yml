name: Message Bridge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: go test ./...
        working-directory: third_party/whatsapp-mcp

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - run: npm ci
      - run: npm run notices
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify Windows installer contents
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/Message-Bridge-*-x64.exe)
          if ($installers.Count -ne 1) {
            throw "Expected one x64 installer, found $($installers.Count)"
          }
          scripts/verify-windows-release.ps1 `
            -ApplicationDirectory release/win-unpacked `
            -InstallerPath $installers[0].FullName
