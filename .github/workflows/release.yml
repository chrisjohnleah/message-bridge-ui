name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - run: npm ci
      - run: npm run notices
      - run: npm run typecheck
      - run: npm test
      - run: go test ./...
        working-directory: third_party/whatsapp-mcp

  package:
    needs: verify
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: message-bridge-macos-arm64
            builder_args: --mac dmg zip --arm64 --publish never
            paths: |
              release/Message-Bridge-*-arm64.dmg
              release/Message-Bridge-*-arm64.zip
          - name: macOS Intel
            os: macos-15-intel
            artifact: message-bridge-macos-x64
            builder_args: --mac dmg zip --x64 --publish never
            paths: |
              release/Message-Bridge-*-x64.dmg
              release/Message-Bridge-*-x64.zip
          - name: Windows x64
            os: windows-latest
            artifact: message-bridge-windows-x64
            builder_args: --win nsis --x64 --publish never
            paths: release/Message-Bridge-*-x64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - run: npm ci
      - run: npm run notices
      - run: npm run build
      - name: Package application
        run: npx electron-builder ${{ matrix.builder_args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Message-Bridge-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/Message-Bridge-*
          release-assets/SHA256SUMS.txt
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "Message Bridge ${GITHUB_REF_NAME}"
          --notes-file docs/releases/v0.1.0.md
