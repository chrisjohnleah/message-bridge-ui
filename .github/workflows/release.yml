name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: message-bridge-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - name: Verify release metadata
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${package_version}" != "${tag_version}" ]]; then
            echo "package.json version ${package_version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - run: npm ci
      - run: npm run notices
      - run: npm run typecheck
      - run: npm test
      - run: go test ./...
        working-directory: third_party/whatsapp-mcp

  package:
    needs: verify
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: message-bridge-macos-arm64
            builder_args: --mac dmg zip --arm64 --publish never
            paths: |
              release/Message-Bridge-*-arm64.dmg
              release/Message-Bridge-*-arm64.zip
          - name: macOS Intel
            os: macos-15-intel
            artifact: message-bridge-macos-x64
            builder_args: --mac dmg zip --x64 --publish never
            paths: |
              release/Message-Bridge-*-x64.dmg
              release/Message-Bridge-*-x64.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - run: npm ci
      - run: npm run notices
      - run: npm run build
      - name: Prepare macOS release credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in \
            MACOS_CSC_LINK \
            MACOS_CSC_KEY_PASSWORD \
            APPLE_API_KEY_P8_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required macOS release secrets: ${missing[*]}" >&2
            exit 1
          fi

          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${api_key_path}"
          chmod 600 "${api_key_path}"
          echo "APPLE_API_KEY=${api_key_path}" >> "${GITHUB_ENV}"
      - name: Package application
        run: npx electron-builder ${{ matrix.builder_args }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/verify-macos-release.sh release/Message-Bridge-*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  publish-windows-store:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - run: npm ci
      - run: npm run notices
      - run: npm run build
      - run: npx electron-builder --win appx --x64 --publish never
      - name: Verify Microsoft Store package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem release/Message-Bridge-*-x64.appx)
          if ($packages.Count -ne 1) {
            throw "Expected one x64 AppX package, found $($packages.Count)"
          }
          scripts/verify-windows-store-package.ps1 -PackagePath $packages[0].FullName
      - name: Require Microsoft Store release credentials
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $missing = @()
          foreach ($name in @(
            "PARTNER_CENTER_TENANT_ID",
            "PARTNER_CENTER_SELLER_ID",
            "PARTNER_CENTER_CLIENT_ID",
            "PARTNER_CENTER_CLIENT_SECRET"
          )) {
            if ([string]::IsNullOrWhiteSpace(
                [Environment]::GetEnvironmentVariable($name)
              )) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required Microsoft Store release secrets: $($missing -join ', ')"
          }
      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1
      - name: Authenticate Microsoft Store Developer CLI
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
      - name: Submit package to Microsoft Store
        shell: pwsh
        run: |
          $package = Get-ChildItem release/Message-Bridge-*-x64.appx
          msstore publish $package.FullName -id 9PBD74ZRV6ZT

  publish:
    needs:
      - package
      - publish-windows-store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: message-bridge-macos-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Message-Bridge-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/Message-Bridge-*
          release-assets/SHA256SUMS.txt
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "Message Bridge ${GITHUB_REF_NAME}"
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
