name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: message-bridge-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - name: Verify release metadata
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${package_version}" != "${tag_version}" ]]; then
            echo "package.json version ${package_version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - run: npm ci
      - run: npm run notices
      - run: npm run typecheck
      - run: npm test
      - run: go test ./...
        working-directory: third_party/whatsapp-mcp

  package:
    needs: verify
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: message-bridge-macos-arm64
            builder_args: --mac dmg zip --arm64 --publish never
            paths: |
              release/Message-Bridge-*-arm64.dmg
              release/Message-Bridge-*-arm64.zip
          - name: macOS Intel
            os: macos-15-intel
            artifact: message-bridge-macos-x64
            builder_args: --mac dmg zip --x64 --publish never
            paths: |
              release/Message-Bridge-*-x64.dmg
              release/Message-Bridge-*-x64.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - run: npm ci
      - run: npm run notices
      - run: npm run build
      - name: Prepare macOS release credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in \
            MACOS_CSC_LINK \
            MACOS_CSC_KEY_PASSWORD \
            APPLE_API_KEY_P8_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required macOS release secrets: ${missing[*]}" >&2
            exit 1
          fi

          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${api_key_path}"
          chmod 600 "${api_key_path}"
          echo "APPLE_API_KEY=${api_key_path}" >> "${GITHUB_ENV}"
      - name: Package application
        run: npx electron-builder ${{ matrix.builder_args }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/verify-macos-release.sh release/Message-Bridge-*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  package-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/whatsapp-mcp/go.mod
          cache-dependency-path: third_party/whatsapp-mcp/go.sum
      - run: npm ci
      - run: npm run notices
      - run: npm run build
      - name: Build unpacked Windows application
        run: npx electron-builder --win dir --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Require Azure Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $missing = @()
          foreach ($name in @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "AZURE_ARTIFACT_SIGNING_ENDPOINT",
            "AZURE_ARTIFACT_SIGNING_ACCOUNT",
            "AZURE_ARTIFACT_SIGNING_PROFILE"
          )) {
            if ([string]::IsNullOrWhiteSpace(
                [Environment]::GetEnvironmentVariable($name)
              )) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required Azure Artifact Signing configuration: $($missing -join ', ')"
          }
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows application executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\release\win-unpacked\Message Bridge.exe
            ${{ github.workspace }}\release\win-unpacked\resources\bin\whatsapp-bridge.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Message Bridge
          description-url: https://github.com/chrisjohnleah/message-bridge-ui
      - name: Build Windows installer from signed application
        run: >-
          npx electron-builder
          --win nsis
          --x64
          --prepackaged release/win-unpacked
          --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Sign Windows installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: Message-Bridge-*-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Message Bridge installer
          description-url: https://github.com/chrisjohnleah/message-bridge-ui
      - name: Verify Windows signatures and installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/Message-Bridge-*-x64.exe)
          if ($installers.Count -ne 1) {
            throw "Expected one signed x64 installer, found $($installers.Count)"
          }
          scripts/verify-windows-release.ps1 `
            -ApplicationDirectory release/win-unpacked `
            -InstallerPath $installers[0].FullName `
            -RequireSignature
      - uses: actions/upload-artifact@v7
        with:
          name: message-bridge-windows-x64
          path: release/Message-Bridge-*-x64.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - package
      - package-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: message-bridge-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Message-Bridge-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/Message-Bridge-*
          release-assets/SHA256SUMS.txt
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "Message Bridge ${GITHUB_REF_NAME}"
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
